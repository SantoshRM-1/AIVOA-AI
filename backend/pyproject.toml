[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aivoa-ai-rca"
version = "0.1.0"
description = "API foundation for AIVOA AI Root Cause Analysis and CAPA Assistant"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "pydantic-settings>=2.4,<3", "psycopg[binary]>=3.2,<4", "langgraph>=1.0,<2", "google-genai>=1.0,<2", "PyMuPDF>=1.24,<2", "python-multipart>=0.0.9,<1", "reportlab>=4,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
lint = ["ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]
